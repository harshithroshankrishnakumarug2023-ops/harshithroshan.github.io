<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="t d">
  <title id="t">Portrait placeholder</title>
  <desc id="d">A neutral placeholder frame with a simple silhouette. Replace with your own photograph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfdfc"/>
      <stop offset="0.55" stop-color="#f4f6f6"/>
      <stop offset="1" stop-color="#e9edef"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4e6e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2c6152" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="480" height="600" fill="url(#bg)"/>

  <!-- Faint rule grid, echoing the hairlines used across the site. -->
  <g stroke="#dcdfe0" stroke-width="1">
    <path d="M0 150H480M0 300H480M0 450H480"/>
    <path d="M120 0V600M240 0V600M360 0V600"/>
  </g>

  <!-- Silhouette: neutral, no fabricated face. -->
  <g fill="none" stroke="#c3ccd2" stroke-width="2">
    <circle cx="240" cy="232" r="84"/>
    <path d="M116 452c0-68 56-124 124-124s124 56 124 124"/>
  </g>

  <rect x="0.75" y="0.75" width="478.5" height="598.5" fill="none" stroke="#d7d7d0" stroke-width="1.5"/>

  <text x="240" y="518" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="url(#mark)" letter-spacing="6">HR</text>
  <text x="240" y="548" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b8b84" letter-spacing="1.6">PHOTOGRAPH TO COME</text>
</svg>